name: Temp Whisper static binary
on:
  push:
    branches:
      - tmp-chatgpt-it-asr-model-20261002
jobs:
  build-whisper:
    runs-on: ubuntu-latest
    steps:
      - name: Build static whisper.cpp
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/ggml-org/whisper.cpp.git
          cmake -S whisper.cpp -B whisper.cpp/build -DCMAKE_BUILD_TYPE=Release -DBUILD_SHARED_LIBS=OFF -DWHISPER_BUILD_TESTS=OFF -DWHISPER_BUILD_EXAMPLES=ON
          cmake --build whisper.cpp/build -j 4
          mkdir -p bundle
          cp whisper.cpp/build/bin/whisper-cli bundle/
          ldd bundle/whisper-cli || true
      - name: Upload static binary
        uses: actions/upload-artifact@v4
        with:
          name: whisper-cli-static-linux
          path: bundle/whisper-cli
          compression-level: 0
          retention-days: 1
