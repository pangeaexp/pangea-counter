name: Temp Whisper ASR fetch
on:
  push:
    branches:
      - tmp-chatgpt-it-asr-model-20261002
jobs:
  build-whisper:
    runs-on: ubuntu-latest
    steps:
      - name: Build whisper.cpp
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/ggml-org/whisper.cpp.git
          cmake -S whisper.cpp -B whisper.cpp/build -DCMAKE_BUILD_TYPE=Release -DWHISPER_BUILD_TESTS=OFF -DWHISPER_BUILD_EXAMPLES=ON
          cmake --build whisper.cpp/build -j 4
          mkdir -p whisper_bundle
          cp whisper.cpp/build/bin/whisper-cli whisper_bundle/
          ldd whisper_bundle/whisper-cli || true
      - name: Fetch large-v3-turbo q5 model
        shell: bash
        run: |
          set -euo pipefail
          curl -L --retry 5 --retry-delay 2 -o whisper_bundle/ggml-large-v3-turbo-q5_0.bin https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-large-v3-turbo-q5_0.bin
          sha256sum whisper_bundle/ggml-large-v3-turbo-q5_0.bin
          ls -lh whisper_bundle
      - name: Upload Whisper bundle
        uses: actions/upload-artifact@v4
        with:
          name: whisper-large-v3-turbo-q5
          path: whisper_bundle
          compression-level: 0
          if-no-files-found: error
          retention-days: 1
